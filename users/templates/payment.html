<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>XpressGo - Payment</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body {
            min-height: 100vh;
            background: #f7f7f5;
            color: #171717;
        }

        /* PAYMENT CARD */

        .payment-box {
            width: 480px;
            background: #ffffff;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.10);
            border: 1px solid #eeeeee;
        }


        /* HEADER */

        .payment-header {
            background: linear-gradient(135deg, #ff7a00, #ff9f43);
            color: white;
            text-align: center;
            padding: 35px 25px;
        }

        .payment-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 15px;

            border-radius: 50%;

            background: white;
            color: #ff7a00;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 32px;

            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .payment-header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .payment-header p {
            margin: 0;
            opacity: 0.85;
            font-size: 14px;
        }


        /* CONTENT */

        .payment-content {
            padding: 30px;
        }


        /* DETAILS */

        .details {
            background: #fafafa;
            border: 1px solid #eeeeee;
            border-radius: 16px;
            padding: 8px 18px;
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 15px 0;

            border-bottom: 1px solid #e9e9e9;
        }

        .row:last-child {
            border-bottom: none;
        }

        .label {
            color: #777777;
            font-size: 14px;
        }

        .value {
            color: #222222;
            font-weight: 600;
            font-size: 15px;
        }

        .price {
            color: #ff7a00;
            font-weight: 700;
        }


        /* TOTAL */

        .total {
            margin-top: 18px;

            padding: 18px;

            border-radius: 14px;

            background: linear-gradient(
                135deg,
                #fff3e6,
                #fff8f1
            );

            border: 1px solid #ffd9b3;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .total span:first-child {
            color: #222222;
            font-size: 16px;
            font-weight: 700;
        }

        .total span:last-child {
            color: #ff7a00;
            font-size: 25px;
            font-weight: 800;
        }


        /* PAY BUTTON */

        .payement {
            margin-top: 25px;
        }

        .payement form {
            width: 100%;
        }

        .payement input[type="submit"] {
            width: 100%;
            height: 52px;

            border: none;
            border-radius: 12px;

            background: linear-gradient(
                90deg,
                #ff7a00,
                #ff9f43
            );

            color: white;

            font-size: 16px;
            font-weight: 700;

            cursor: pointer;

            transition: all 0.3s ease;

            box-shadow: 0 7px 18px rgba(255, 122, 0, 0.20);
        }

        .payement input[type="submit"]:hover {
            transform: translateY(-2px);

            background: linear-gradient(
                90deg,
                #e86600,
                #ff8c26
            );

            box-shadow: 0 10px 25px rgba(255, 122, 0, 0.30);
        }


        /* SECURE */

        .secure {
            text-align: center;

            color: #888;

            font-size: 12px;

            margin-top: 20px;
        }

        .secure i {
            color: #ff7a00;
        }


        /* BRAND */

        .brand {
            text-align: center;
            padding: 18px;

            background: #fafafa;

            border-top: 1px solid #eeeeee;

            color: #777;

            font-size: 12px;
        }

        .brand strong {
            color: #ff7a00;
        }


        /* MOBILE */

        @media (max-width: 550px) {

            .payment-box {
                width: 92%;
            }

            .payment-content {
                padding: 22px;
            }

            .payment-header {
                padding: 30px 20px;
            }

            .payment-header h1 {
                font-size: 24px;
            }

        }

    </style>

</head>


<body>

    <div class="container-fluid min-vh-100
                d-flex justify-content-center
                align-items-center py-4">


        <div class="payment-box">


            <!-- HEADER -->

            <div class="payment-header">

                <div class="payment-icon">

                    <i class="bi bi-credit-card-fill"></i>

                </div>

                <h1>
                    Payment Summary
                </h1>

                <p>
                    Review your order charges
                </p>

            </div>


            <!-- CONTENT -->

            <div class="payment-content">


                <!-- ORDER DETAILS -->

                <div class="details">


                    <div class="row">

                        <span class="label">
                            Location
                        </span>

                        <span class="value">
                            {{ location }}
                        </span>

                    </div>


                    <div class="row">

                        <span class="label">
                            Distance
                        </span>

                        <span class="value">
                            {{ locationkm }} KM
                        </span>

                    </div>


                    <div class="row">

                        <span class="label">
                            Weight
                        </span>

                        <span class="value">
                            {{ kg }} KG
                        </span>

                    </div>


                    <div class="row">

                        <span class="label">
                            Distance Price
                        </span>

                        <span class="value price">
                            ₹{{ kmamount }}
                        </span>

                    </div>


                    <div class="row">

                        <span class="label">
                            Weight Price
                        </span>

                        <span class="value price">
                            ₹{{ kgamount }}
                        </span>

                    </div>


                </div>


                <!-- TOTAL -->

                <div class="total">

                    <span>
                        Total Amount
                    </span>

                    <span>
                        ₹{{ total }}
                    </span>

                </div>


                <!-- PAYMENT -->

                <div class="payement">

                    <form action="{% url 'customerdashboard' cust_id %}"
                          method="post">

                        {% csrf_token %}

                        <input type="submit"
                               value="✓  Pay Now">

                    </form>

                </div>


                <!-- SECURE -->

                <div class="secure">

                    <i class="bi bi-shield-lock-fill"></i>

                    &nbsp; Secure Payment

                </div>

            </div>


            <!-- FOOTER -->

            <div class="brand">

                Powered by
                <strong>XpressGo</strong>

                · Fast. Reliable. Delivered.

            </div>


        </div>

    </div>


    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
