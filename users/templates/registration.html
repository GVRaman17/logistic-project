<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>XpressGo - Registration</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body {
            background: #f7f7f5 !important;
            color: #171717;
        }

        /* MAIN CARD */

        .register-card {
            border-radius: 24px !important;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.10) !important;
        }

        /* BRAND HEADER */

        .brand-header {
            background: linear-gradient(135deg, #ff7a00, #ff9f43);
            color: white;
        }

        .brand-icon {
            width: 78px;
            height: 78px;
            background: white;
            color: #ff7a00;
            border-radius: 50%;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .brand-name {
            font-size: 34px;
            letter-spacing: -1px;
        }

        /* INPUTS */

        .input-group-text {
            border-color: #e5e5e5;
            color: #ff7a00;
        }

        .form-control,
        .form-select {
            border-color: #e5e5e5;
            min-height: 48px;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #ff7a00;
            box-shadow: 0 0 0 0.2rem rgba(255, 122, 0, 0.12);
        }

        /* REGISTER BUTTON */

        .btn-orange {
            background: #ff7a00;
            border-color: #ff7a00;
            color: white;
        }

        .btn-orange:hover {
            background: #e86600;
            border-color: #e86600;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 122, 0, 0.25);
        }

        /* CLEAR BUTTON */

        .btn-clear {
            border: 1px solid #d8d8d8;
            color: #555;
            background: white;
        }

        .btn-clear:hover {
            background: #f3f3f3;
            color: #222;
        }

        /* LOGIN LINK */

        .login-link {
            color: #ff7a00;
        }

        .login-link:hover {
            color: #e86600;
        }

        /* FOOTER */

        .footer {
            background: #fafafa !important;
        }

        .footer-icon {
            color: #ff7a00;
        }

        /* LABELS */

        .form-label {
            color: #292929;
        }

        /* DISABLED ACCOUNT TYPE */

        select:disabled {
            background-color: #f4f4f4;
            color: #777;
        }

        @media (max-width: 500px) {

            .brand-name {
                font-size: 29px;
            }

        }

    </style>
</head>


<body>

    <div class="container-fluid min-vh-100 d-flex justify-content-center align-items-center py-5">

        <div class="row w-100 justify-content-center">

            <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">

                <div class="card register-card border-0 overflow-hidden">


                    <!-- BRAND HEADER -->

                    <div class="brand-header text-center p-4">

                        <div class="brand-icon mb-3">

                            <i class="bi bi-box-seam-fill fs-1"></i>

                        </div>

                        <h1 class="brand-name fw-bold mb-1">
                            XpressGo
                        </h1>

                        <p class="mb-0 opacity-75">
                            Fast. Reliable. Delivered.
                        </p>

                    </div>


                    <!-- REGISTRATION FORM -->

                    <div class="card-body p-4 p-md-5">

                        <div class="text-center mb-4">

                            <h3 class="fw-bold">
                                Create Account
                            </h3>

                            <p class="text-muted mb-0">
                                Register as a customer to get started
                            </p>

                        </div>


                        <form action="{% url 'registrationprocess' %}" method="post">

                            {% csrf_token %}


                            <!-- USERNAME -->

                            <div class="mb-3">

                                <label for="uname"
                                       class="form-label fw-semibold">

                                    Username

                                </label>

                                <div class="input-group">

                                    <span class="input-group-text bg-white">

                                        <i class="bi bi-person-fill"></i>

                                    </span>

                                    <input type="text"
                                           name="uname"
                                           id="uname"
                                           class="form-control"
                                           placeholder="Enter username">

                                </div>

                            </div>


                            <!-- PASSWORD -->

                            <div class="mb-3">

                                <label for="pwt"
                                       class="form-label fw-semibold">

                                    Password

                                </label>

                                <div class="input-group">

                                    <span class="input-group-text bg-white">

                                        <i class="bi bi-lock-fill"></i>

                                    </span>

                                    <input type="password"
                                           name="pwt"
                                           id="pwt"
                                           class="form-control"
                                           placeholder="Create password">

                                </div>

                            </div>


                            <!-- ACCOUNT TYPE -->

                            <div class="mb-4">

                                <label for="acctype"
                                       class="form-label fw-semibold">

                                    Account Type

                                </label>

                                <div class="input-group">

                                    <span class="input-group-text bg-white">

                                        <i class="bi bi-person-badge-fill"></i>

                                    </span>

                                    <select name="acctype"
                                            id="acctype"
                                            class="form-select"
                                            disabled>

                                        <option value="admin">
                                            admin
                                        </option>

                                        <option value="customer" selected>
                                            customer
                                        </option>

                                        <option value="driver">
                                            driver
                                        </option>

                                    </select>

                                </div>

                            </div>


                            <!-- BUTTONS -->

                            <div class="d-flex gap-2">

                                <input type="submit"
                                       value="Registration"
                                       class="btn btn-orange btn-lg w-50 fw-semibold">

                                <input type="reset"
                                       value="clear"
                                       class="btn btn-clear btn-lg w-50 fw-semibold">

                            </div>

                        </form>


                        <!-- LOGIN -->

                        <div class="text-center mt-4 pt-4 border-top">

                            <span class="text-muted">
                                Already have an account?
                            </span>

                            <a href="{% url 'mainlogin' %}"
                               class="login-link fw-bold text-decoration-none ms-1">

                                Login

                            </a>

                        </div>

                    </div>


                    <!-- FOOTER -->

                    <div class="footer text-center py-3">

                        <small class="text-muted">

                            <i class="bi bi-shield-check footer-icon"></i>

                            Secure XpressGo Customer Registration

                        </small>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
